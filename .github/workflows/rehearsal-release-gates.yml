name: Rehearsal · release quality gates (Windows / macOS)

# 演练用工作流,只存在于 rehearsal/* 分支,演练结束后随分支删除,不得合入 main 或候选分支。
# 逐字复刻 release.yml 的 build 作业在「构建与签名」之前的全部质量门,用来在正式打 v* 标签之前
# 先确认它们能在 windows-2025 与 macos-15 上通过。不挂 release-signing environment,不读任何 secret,
# 不运行 tauri-action,不产出安装包。
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: rehearsal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-2025
            rust_host: x86_64-pc-windows-msvc
          - platform: macos-15
            rust_host: aarch64-apple-darwin
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable action; Rust 1.88.0 below
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          workspaces: src-tauri
      - name: Verify build architecture
        shell: bash
        env:
          EXPECTED_RUST_HOST: ${{ matrix.rust_host }}
        run: |
          set -euo pipefail
          ACTUAL_RUST_HOST=$(rustc -vV | sed -n 's/^host: //p' | tr -d '\r')
          test "$ACTUAL_RUST_HOST" = "$EXPECTED_RUST_HOST" || {
            echo "runner target mismatch: expected $EXPECTED_RUST_HOST, got $ACTUAL_RUST_HOST" >&2
            exit 1
          }
      - name: Report ruby availability (workflow guards parse YAML with ruby)
        shell: bash
        run: ruby -ryaml -rjson -e 'puts RUBY_VERSION' || echo 'ruby NOT available on PATH'
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - name: Rust format
        shell: bash
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - name: Rust lint
        shell: bash
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked -- -D warnings
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      # 正式发版时由 tauri-action 经 tauri.conf.json 的 beforeBuildCommand 执行同一条命令
      - name: Frontend build (same command as beforeBuildCommand)
        run: npm run build
